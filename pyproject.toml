[project]
name = "grokbot-ai-manju"
version = "0.0.1"
description = "Grok Bot full-pipeline AI manju conductor: local ComfyUI (Wan/MiniMax H3) + FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
manju = "grokbot_ai_manju.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
