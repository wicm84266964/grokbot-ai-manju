[project]
name = "manju-conductor"
version = "0.1.0"
description = "Grok Bot conductor for local ComfyUI (MiniMax H3) + FFmpeg AI drama pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
manju = "manju_conductor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
